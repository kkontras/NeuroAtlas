# Build the documentation site with MkDocs on every push, and publish it on
# GitHub Pages when the repository is public (Pages is enabled on first use).
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the doc tools (the docs extra of pyproject.toml)
        run: |
          python - > docs-requirements.txt <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print("\n".join(tomllib.load(f)["project"]["optional-dependencies"]["docs"]))
          PY
          pip install -r docs-requirements.txt
      - name: Build
        run: mkdocs build --strict
      - if: github.event.repository.visibility == 'public'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
