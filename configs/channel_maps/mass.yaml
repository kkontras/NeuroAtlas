notes:
  eegpt: Standard 10-20 expanded to 16 channels. Paper pretrained unipolar; identity mappings (case-folded to uppercase).
  labram: Standard 10-20 expanded to 16 channels → standard_1020 referential anchors.
  neurolm: Uppercase per NeuroLM standard_1020 vocabulary.
  reve: REVE uses mixed-case per position bank. T3→T7, T4→T8 per 10-10 naming convention.
  steegformer: Standard 10-20 display names; identity mapping. Full 19-channel coverage in the 142-entry vocabulary.
  neurogpt: "Standard 10-20 display names case-folded to uppercase for NeuroGPT legacy layout. Best coverage: 19/22, missing T1/T2/OZ."
  biot: 19 monopolar channels → uppercase 10-20 names (T3→T7, T4→T8, T5→P7, T6→P8 aliases). Wrapper computes all 16/16 derivations by subtraction. FZ, CZ, PZ are extras not referenced by any BIOT slot.
  sleepfm: SleepFM is channel-label-agnostic (no position embedding); all channels passed through, wrapper pads to 10 BAS slots.
  chronos: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  moment: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  timemoe: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  moirai: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  core_sleep: Single-channel; wrapper selects C4 > C3 > Fpz-Cz by name preference.
  sleep_transformer: Single-channel; wrapper selects C4 > C3 > Fpz-Cz by name preference.
  sleepyco: Single-channel; wrapper selects C4 > C3 > Fpz-Cz by name preference.
  lagllama: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  timesfm: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
