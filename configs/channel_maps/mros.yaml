notes:
  eegpt: Bipolar central onto referential C3/C4 anchor; paper pretrained unipolar, bipolar → nearest-electrode is an approximation.
  cbramod: Index-based and permutation-invariant across channels; bipolar labels passed through unchanged.
  labram: Bipolar central onto standard_1020 referential names; shared vocabulary with NeuroLM.
  neurolm: Uppercase 10-20 names per NeuroLM standard_1020 vocabulary.
  reve: Lowercase 10-20 names per REVE position bank — kept uppercase here since REVE accepts both.
  biot: Central bipolar mapped to nearest BIOT double-banana slot (C3-A2→C3-P3, C4-A1→C4-P4 — closest central derivation in BIOT's 16-slot vocabulary). 14/16 slots zero-padded.
  sleepfm: Channel-label-agnostic (no position embedding); bipolar labels passed through, wrapper pads to 10 BAS slots.
  chronos: Univariate per-channel; channel labels passed through (UnivariateTimeSeriesBackbone flattens (B,C,T)→(B*C,T) and mean-pools over channels).
  moirai: Univariate per-channel; channel labels passed through.
  moment: Univariate per-channel; channel labels passed through.
  timesfm: Univariate per-channel; channel labels passed through.
  neurogpt: Bipolar central onto referential C3/C4 anchor in NeuroGPT's 22-ch legacy 10-20 layout (match-ratio 2/22). M2/A2 and M1/A1 are the same mastoids.
  neurorvq: Bipolar central onto referential C3/C4 anchor in NeuroRVQ's 102-label global vocabulary.
  steegformer: Vocab-strict supervised model on standard 10-20 names; central bipolar mapped onto referential C3/C4 anchor.
  core_sleep: Multi-modal (STFT-EEG + STFT-EOG) supervised CoRe-Sleep model; bipolar labels pass through, wrapper internally selects best channel via _best_channel_index, computes STFT (n_fft=256, 100Hz), and zero-pads EOG channel since MrOS extraction is EEG-only. Embeddings are 128d "combined" output.
  sleep_transformer: Wrapper selects best channel by name preference; bipolar labels pass through.
  sleepyco: Wrapper selects best channel by name preference; bipolar labels pass through.
