notes:
  eegpt: Linked-ear bipolars → referential 10-20 anchors. Paper pretrained unipolar at 58 channels; the bipolar→unipolar mapping is an approximation (signal values remain bipolar differences).
  cbramod: CBraMod is index-based and permutation-invariant; pass the bipolar labels through unchanged.
  labram: Linked-ear bipolars → standard_1020 referential anchors; shared vocabulary with NeuroLM.
  neurolm: Uppercase per NeuroLM standard_1020 vocabulary.
  reve: Lowercase 10-20 names per REVE position bank; bipolar→referential approximation same as EEGPT/LaBraM.
  steegformer: Linked-ear bipolars → referential 10-20 anchors; monopolar anchor approximation.
  neurorvq: Linked-ear bipolars → referential 10-20 anchors; monopolar anchor approximation.
  neurogpt: Linked-ear bipolars → referential 10-20 anchors in NeuroGPT's legacy layout (match-ratio 6/22).
  biot: 6 monopolar channels → uppercase 10-20 names. Wrapper computes 2 derivations (F3-C3, F4-C4), 8 single-electrode approximations, 6 zero-padded.
  sleepfm: SleepFM is channel-label-agnostic (no position embedding); all channels passed through, wrapper pads to 10 BAS slots.
  chronos: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  moment: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  timemoe: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  moirai: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  lagllama: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  timesfm: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
