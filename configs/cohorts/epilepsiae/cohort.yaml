# epilepsiae — dataset manifest
#
# Schema: datasets/_schema.yaml
# First generated from the hand-written DatasetSpec this cohort used to have,
# plus the constants its per-dataset entrypoint pinned; hand-maintained since.
# Edit this file, not the spec module, which only binds the manifest to a
# datamodule.

schema_version: 1

slug: epilepsiae
name: Epilepsiae
domain: epilepsy
paper_dataset: true

description: >
  EPILEPSIAE multi-center scalp EEG seizure detection benchmark.

cohort:
  centre: "EPILEPSIAE consortium (Freiburg, Coimbra, Paris)"
  country: DE
  powerline_hz: 50

acquisition:
  kind: manual

signal:
  montage: bipolar
  window_s: 10.0
  notch_freq: null

labels:
  granularity: window
  # one label per window; event-level metrics (any-overlap, FA/h) are computed on top of the window scores
  default: binary
  modes:
    binary:
      implemented_by: dataio.epilepsiae
  # Implemented in the loader but not set by any shipped config, task
  # preset or launcher. Recorded so the capability is not lost; not
  # offered by --help, because an option nobody runs is noise.
  also_implemented:
    - multiclass
    - pattern
splits:
  derivation: >
    StratifiedKFold(shuffle=True, random_state=42) over sorted patient ids
  derived_by: src/extensions/datasets/adapters/epilepsiae.py:141
  # No fold manifest: there is no file to inspect, but the split is
  # reproducible because the splitter is seeded and the subject order
  # is sorted.
  manifest: null
  grouping: patient
  n_folds: 5

pipeline:
  # How `prepare` builds this cohort's optional fast-path cache.
  # The flag names differ per builder, so they are recorded here
  # rather than guessed.
  preprocessor:
    # Optional. The default backend reads the raw corpus directly -- see
    # `backend`/runtime_defaults below -- so this cache only speeds up large
    # sweeps. `prepare --dataset epilepsiae` is never a prerequisite for `embed`.
    optional: true
    module: extensions.datasets.preprocessors.preprocess_epilepsiae
    args:
      raw: --data-root
      out: --cache-root
    shard:
      index: --shard-index
      count: --num-shards
  recording_stats: streaming

runtime_defaults:
  batch_size: 64
  data_root: "${EEG_DATA_ROOT}/Epillepsie"
  fold: 0
  label_mode: binary
  montage: bipolar
  n_folds: 5
  window_s: 10.0


# Allowed values for the enumerable --set keys, and where the code
# enforces them. Surfaced by `--dataset <slug> --help`.
runtime_options:
  label_mode:
    values:
      - binary
    enforced_by: dataio.epilepsiae

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: extensions.datasets.adapters.epilepsiae.EpilepsiAEBenchmarkDataModule
  default_task: linear_probe
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: eeg
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - signal_kind
    - fold
    - n_folds

provenance:
  last_verified: 2026-09-21
  known_issues:
    - "default_task is `linear_probe`, but this is a continuously
       labelled cohort (one label per 10 s window) like chbmit, siena,
       sz1/sz2, tusz, aub_med and helsinki_neonatal — all of which use
       `seizure_detection`. The three cohorts that legitimately use
       linear_probe (bonn, nmt, tuab) are all recording-level. So
       Epilepsiae is scored WITHOUT the event-level metrics the other
       continuous cohorts get. run/configs/benchmark_epilepsiae_test.json
       agrees with the spec, so this is what was actually run — changing
       it is a scientific decision, not a bug fix. Needs a maintainer."
