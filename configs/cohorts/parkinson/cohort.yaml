# parkinson — dataset manifest
#
# Schema: datasets/_schema.yaml
# First generated from the hand-written DatasetSpec this cohort used to have,
# plus the constants its per-dataset entrypoint pinned; hand-maintained since.
# Edit this file, not the spec module, which only binds the manifest to a
# datamodule.

schema_version: 1

slug: parkinson
name: Parkinson
domain: sleep
paper_dataset: false

description: >
  Parkinson PSG benchmark adapter for patient-level downstream tasks.

cohort:
  centre: Parkinson sleep cohort
  country: BE
  powerline_hz: 50

acquisition:
  kind: internal

signal:
  target_sfreq: 256.0
  notch_freq: null

labels:
  granularity: recording
  # one label for the whole recording; window scores are aggregated to the recording before scoring — this is the DEFAULT mode's granularity;
  # a mode that differs says so under modes.<name>.granularity
  default: group
  modes:
    group:
      note: PD vs healthy older adults; subject-level, see spec.default_task
splits:
  derivation: >
    StratifiedKFold(shuffle=True, random_state=42) over patients; the test
    set is fold `fold`, and validation is taken from the next fold index,
    giving a 90/10 train/val split of the remainder
  derived_by: src/extensions/datasets/adapters/parkinson.py:109-126
  # No fold manifest: reproducible because the splitter is seeded,
  # but there is no file to inspect or to pin across repo versions.
  manifest: null
  grouping: patient
  n_folds: 5

runtime_defaults:
  batch_size: 32
  data_root: "${EEG_DATA_ROOT}/raw-sleep/Parkinson_data"
  fold: 0
  mode: single
  n_folds: 5
  num_workers: 0
  subject_list_file: ds_all_86.tsv
  target_sfreq: 256.0


# Allowed values for the enumerable --set keys, and where the code
# enforces them. Surfaced by `--dataset <slug> --help`.
runtime_options:
  mode:
    values:
      - single
      - multi
    enforced_by: adapters.parkinson

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: extensions.datasets.adapters.parkinson.ParkinsonBenchmarkDataModule
  default_task: patient_classification
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: raw
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - mode
    - fold
    - n_folds

provenance:
  last_verified: 2026-09-21
