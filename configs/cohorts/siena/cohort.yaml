# siena — dataset manifest
#
# Schema: datasets/_schema.yaml
# First generated from the hand-written DatasetSpec this cohort used to have,
# plus the constants its per-dataset entrypoint pinned; hand-maintained since.
# Edit this file, not the spec module, which only binds the manifest to a
# datamodule.

schema_version: 1

slug: siena
name: Siena
domain: epilepsy
paper_dataset: true

description: >
  Siena Scalp EEG Database — binary seizure detection from 19-channel
  unipolar EEG resampled to 256 Hz. 14 adult subjects, 128 hours, 47
  seizures. Patient-level k-fold evaluation.

cohort:
  centre: "University of Siena, Italy"
  country: IT
  powerline_hz: 50
  population: adult

acquisition:
  kind: zenodo
  size_gb: 4.5                      # the download script (no longer shipped),18
  file: BIDS_Siena.zip                      # the download script (no longer shipped),18
  ref: 10640762
  upstream: "https://physionet.org/content/siena-scalp-eeg/1.0.0/"

signal:
  montage: bipolar
  montage_conflict:
    resolved_to: bipolar
    reason: kept the DatasetSpec value to preserve current behaviour
    sources:
      DatasetSpec.config_defaults: bipolar
      embed_dataset._DEFAULT_MONTAGE: unipolar
      description: unipolar
    open_question: audit OQ-11.2 — needs a maintainer decision
  window_s: 10.0
  overlap_threshold: 0.0
  notch_freq: null

labels:
  granularity: window
  # one label per window; event-level metrics (any-overlap, FA/h) are computed on top of the window scores
  default: binary
  modes:
    binary: {}

splits:
  derivation: >
    StratifiedKFold(shuffle=True, random_state=42) over sorted patient ids;
    folds capped at the patient count (Siena has 14 subjects)
  derived_by: src/extensions/datasets/adapters/siena.py:81
  # No fold manifest: there is no file to inspect, but the split is
  # reproducible because the splitter is seeded and the subject order
  # is sorted.
  manifest: null
  grouping: patient
  n_folds: 5

pipeline:
  recording_stats: via_dataio

runtime_defaults:
  backend: bids
  balance: weighted_sampler
  batch_size: 64
  bids_root: "${REPO_ROOT}/siena_cache/raw/BIDS_Siena"
  cache_root: "${REPO_ROOT}/siena_cache/hdf5"
  fold: 0
  label_mode: binary
  montage: bipolar
  n_folds: 5
  normalize: none
  num_workers: 4
  overlap_threshold: 0.0
  window_s: 10.0

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: extensions.datasets.adapters.siena.SienaBenchmarkDataModule
  default_task: seizure_detection
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: eeg
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - signal_kind
    - fold
    - n_folds

provenance:
  last_verified: 2026-09-21
