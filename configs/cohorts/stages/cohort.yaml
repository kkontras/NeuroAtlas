# stages — dataset manifest
#
# Schema: datasets/_schema.yaml
# Written by hand 2026-09-27; adapters existed per site, a DatasetSpec did not.

schema_version: 1

slug: stages
name: STAGES
domain: sleep
paper_dataset: true          # App. B.2, one of the 15 sleep cohorts; paper [101]

description: >
  Stanford Technology Analytics and Genomics in Sleep: clinical PSG pooled
  across 13 sites, with four different channel naming conventions that the
  loader normalises to a common bipolar montage.

cohort:
  centre: "13 sites (BOGN, GSBB, GSDV, GSLH, GSSA, GSSW, MSMI, MSNF, MSQW, MSTH, MSTR, STLK, STNF)"
  country: US
  powerline_hz: 60

acquisition:
  kind: nsrr
  ref: stages

signal:
  notch_freq: 60.0

labels:
  granularity: window
  # one label per window — this is the DEFAULT mode's granularity;
  # a mode that differs says so under modes.<name>.granularity
  default: sleep_stage
  modes:
    sleep_stage:
      classes: [W, N1, N2, N3, REM]
      note: 5-class AASM staging per 30 s epoch
      implemented_by: adapters.stages

splits:
  # The union of the 13 per-site manifests, fold by fold: combined fold k is
  # every site's fold k, which makes it site-stratified by construction.
  # Generated once into configs/folds/stages.json rather than unioned at
  # runtime, so the split is a file you can read and diff.
  manifest: ../../folds/stages.json
  derivation: >
    5-fold patient-level partition over 1712 subjects, folds sized 346 / 344
    / 343 / 340 / 339. folds["k"] is fold k's test group; val is group k+1
    and train is the rest. Verified: the five test groups are disjoint, cover
    all 1712 subjects, and no fold leaks train into test or val. Site ids are
    prefixed (BOGN00001), so unioning the sites cannot collide.
  derived_by: src/extensions/datasets/adapters/physioex_base.py  # _resolve_splits
  grouping: patient
  n_folds: 5
  n_subjects: 1712

pipeline:
  preprocessor: null

runtime_defaults:
  # The loader appends `original/STAGES PSGs/<SITE>` itself, so the root is
  # the release directory above that.
  data_root: "${EEG_DATA_ROOT}/data/Guido/stages"
  batch_size: 8
  num_workers: 0
  fold: 0
  signal_kind: raw
  pipeline_name: legacy

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: extensions.datasets.adapters.stages.STAGESBenchmarkDataModule
  default_task: linear_probe
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: raw
  metadata_keys: [fold, signal_kind, pipeline_name]

provenance:
  last_verified: null
  known_issues:
    - "Never loaded. STAGES' corpus is not on the machine this was written on."
    - "The loader defaults to recording='first', so a subject's repeat `_1`
       recording is excluded. The fold manifests are keyed on base subject
       ids, which matches, but this has not been run to confirm."
    - "App. B.3 uses STAGES for brain age, but the loader surfaces no
       demographics, so there is no `age` label mode and brain age cannot run
       on it. Demographics exist in stages-harmonized-dataset-0.3.0.csv,
       which the loader reads for other purposes but does not publish."
