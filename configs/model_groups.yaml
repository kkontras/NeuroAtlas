# The three model groups NeuroAtlas compares, as the paper defines them
# (Appendix A.2: "three complementary groups: supervised EEG models, EEG
# foundation models, and general time-series foundation models").
#
# This is the paper's taxonomy, not a property of any checkpoint, which is why
# it lives here rather than in the registry: the same wrapper could be grouped
# differently by a different paper. `run/launch.sh` reads it so a sweep can say
# "every EEG-FM" without anyone retyping eleven family names.
#
# Membership was checked family by family against the paper's own spellings.
# A family the paper never names goes under `other`, NOT into a group it
# happens to resemble -- `--models eeg_fm` must mean what the paper means by
# EEG-FM, or a sweep silently reports models the paper never evaluated.

schema_version: 1

groups:
  eeg_fm:
    description: >
      EEG foundation models: pretrained on EEG or neurophysiological data with
      masked reconstruction, contrastive, autoregressive, token-prediction or
      multimodal objectives. (App. A.2 also names MIRepNet, which has no
      wrapper here yet.)
    families: [biot, cbramod, eegpt, labram, neurogpt, neurolm, neurorvq,
               reve, sleepfm, steegformer]

  ts_fm:
    description: >
      General time-series foundation models, pretrained on heterogeneous
      non-EEG temporal data. They encode no electrode topology, montage
      geometry or referencing assumptions, so they are the domain-agnostic
      baseline for whether generic temporal pretraining transfers to EEG.
      The paper names exactly these three families (Chronos-T/S/B/L,
      Moirai-S/B/L, MOMENT-S/B/L).
    families: [chronos, moirai, moment]

  supervised:
    description: >
      Supervised-Pre: models trained with supervision on other EEG datasets.
      Epilepsy-trained Seizure-TF and DeepSOZ; sleep-trained SleepTransformer,
      SleePyCo and CoRe-Sleep; the sleep EEG Brain Age feature model; EEGNet.
    families: [seizure_transformer, deepsoz_hem, sleep_transformer, sleepyco,
               core_sleep, brain_age_cnn, eegnetv4]

# Every family below is registered and every registered family is above:
# 10 EEG-FM + 3 TS-FM + 7 Supervised-Pre = the 20 in the checkpoint registry.
# An `other:` block used to sit here listing brainbert, sjepa, timesfm,
# timemoe, lagllama, sleepgpt and physioex as "runnable by name". None of
# them had a wrapper any more, so `--models brainbert` did not work and the
# note promising it did was wrong.
