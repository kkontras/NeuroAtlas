schema_version: 1
name: bci_cognitive
title: Cognitive and affective states
domain: bci
question: Emotion (DREAMER valence and arousal) and mental arithmetic (EEGMat, ArithmeticTask).
paper: App. C.4
embed: --pooling mean
probe: --pooling mean --set n_folds=loso --probe-type linear --class-weight balanced --tune-c 1.0 --max-iter 1000
# DREAMER is one dataset in the paper and two cohorts here, one per label axis,
# which is how its pickles, embeddings and probes are stored.
datasets: [dreamer_valence, dreamer_arousal, eegmat, arithmetic_task]
single: eegmat
metrics:
  headline: balanced_accuracy
  higher_is_better: true
  secondary: [cohen_kappa, macro_f1]
