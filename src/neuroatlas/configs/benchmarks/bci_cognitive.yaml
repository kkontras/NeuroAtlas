schema_version: 1
name: bci_cognitive
title: Cognitive and affective states
domain: bci
question: >
  Emotion (DREAMER valence and arousal) and mental arithmetic (EEGMat,
  ArithmeticTask), tested on people the probe never saw (leave-one-subject-out).
paper: App. C.4
embed: --set confound_control=true --pooling mean
probe: --set confound_control=true --pooling mean --set n_folds=loso --probe-type linear --tune-c 0.001,0.01,0.1,1,10,100 --seeds 0 --max-iter 1000
# DREAMER is one dataset in the paper and two cohorts here, one per label axis,
# which is how its pickles, embeddings and probes are stored.
datasets: [dreamer_valence, dreamer_arousal, eegmat, arithmetic_task]
single: eegmat
# Model families this benchmark does not evaluate: `-m all`, a group or an
# alias leaves them out; naming one is refused.
excluded_models:
  - families: [sleep_transformer, sleepyco, core_sleep]
    reason: >
      sleep-staging sequence models that take sequences of 30 s epochs, not
      the benchmark's trials
  - families: [deepsoz_hem, seizure_transformer]
    reason: >
      seizure-detection models, which the paper reports on epilepsy only
metrics:
  # Plain balanced accuracy; chance (1/C) differs by cohort, so it is a
  # column of its own (the metric registry: balanced_accuracy -> 1/C).
  headline: balanced_accuracy
  higher_is_better: true
  secondary: [cohen_kappa, macro_f1]
  unit: trial
  describe: >
    balanced accuracy over one held-out subject's trials (the mean of the
    per-class recalls)
  fold: >
    leave-one-subject-out, one fold per subject (fold k tests the k-th subject
    in ascending order; one other subject, drawn with seed 42, is the
    validation subject, the rest train); logistic regression, unweighted
    loss, C from 0.001 to 100 chosen on the validation subject's Cohen's kappa
  spread: population SD over the held-out subjects
  note: >
    The paper's figures plot (BA - 1/C) / (1 - 1/C) * 0.5 + 0.5 of this
    number (App. C.4, Eq. 4), which puts chance at 0.5 for every C.
# The variants carry the paper's names (App. D.6, D.8): "confound filtering"
# (the default) or "no filtering", crossed with "mean-pool" or "token
# flattening". `--variant` also accepts the `aliases`. A result is read as
# the variant whose settings it was made with (confound_control and pooling
# in its metadata), whichever folder it is in.
default_variant:
  description: >
    confound filtering, mean-pool: each cohort's file filtered 4-40 Hz at the
    model's own rate (<name>_preprocessed_trackD_<format>.pkl, which `data
    prepare` builds); a trial's patch tokens are averaged into one vector
  paper: Fig. 26b and Table 13 (confound filtering, mean pool)
variants:
  token_flattening:
    description: >
      confound filtering, token flattening: as the default, but a trial's patch
      tokens are concatenated in token order into one vector (tokens x
      dimension) instead of averaged
    paper: Fig. 23 (Cognitive), the confound-filtering bars; Fig. 5b and Table 12
    embed: --set confound_control=true --pooling per_patch
    probe: --set confound_control=true --pooling per_patch --set n_folds=loso --probe-type linear --tune-c 0.001,0.01,0.1,1,10,100 --seeds 0 --max-iter 1000
  no_filtering:
    description: >
      no filtering, mean-pool: each cohort's file in the model's own band and
      rate (<name>_preprocessed_<format>.pkl) (0.1-75 Hz at 200 Hz; EEGPT 0.5-70 Hz at
      256 Hz; ST-EEGFormer and SleepFM 0.1-64 Hz at 128 Hz)
    paper: App. D.8, mean pool without confound filtering
    embed: --set confound_control=false --pooling mean
    probe: --set confound_control=false --pooling mean --set n_folds=loso --probe-type linear --tune-c 0.001,0.01,0.1,1,10,100 --seeds 0 --max-iter 1000
  no_filtering_token_flattening:
    aliases: [per_patch]
    description: >
      no filtering, token flattening: the no-filtering trial, its patch tokens
      concatenated in token order into one vector
    paper: Fig. 23 (Cognitive), the no-filtering bars
    embed: --set confound_control=false --pooling per_patch
    probe: --set confound_control=false --pooling per_patch --set n_folds=loso --probe-type linear --tune-c 0.001,0.01,0.1,1,10,100 --seeds 0 --max-iter 1000
