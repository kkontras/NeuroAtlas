schema_version: 1
name: bci_erp
title: Event-related potentials
domain: bci
question: >
  Is an EEG segment the response to a target stimulus (P300, N170)? Leave-one-subject-out.
paper: App. C.4
# no task: each cohort's own (linear_probe); trial windows come from its manifest
embed: --pooling mean
probe: --pooling mean --set n_folds=loso --probe-type linear --class-weight balanced --tune-c 1.0 --max-iter 1000
datasets: [bi2013a, bi2014a, bnci2014_008, epflp300, erpcore2021_n170]
single: bi2013a
# Model families this benchmark does not evaluate: `-m all`, a group or an
# alias leaves them out; naming one is refused.
excluded_models:
  - families: [sleep_transformer, sleepyco, core_sleep]
    reason: >
      sleep-staging sequence models that take sequences of 30 s epochs, not
      the benchmark's trials
  - families: [deepsoz_hem, seizure_transformer]
    reason: >
      seizure-detection models, which the paper reports on epilepsy only
metrics:
  # Plain balanced accuracy; chance (1/C) differs by cohort, so it is a
  # column of its own (the metric registry: balanced_accuracy -> 1/C).
  headline: balanced_accuracy
  higher_is_better: true
  secondary: [cohen_kappa, macro_f1]
  unit: trial
  describe: >
    balanced accuracy over one held-out subject's trials (the mean of the
    per-class recalls)
  fold: >
    leave-one-subject-out, one fold per subject (another subject is the
    validation fold, the rest train); logistic regression, balanced loss,
    regularisation C = 1
  spread: population SD over the held-out subjects
  note: >
    The paper's figures plot (BA - 1/C) / (1 - 1/C) * 0.5 + 0.5 of this
    number (App. C.4, Eq. 4), which puts chance at 0.5 for every C.
# The variants carry the paper's names (App. D.8): "mean-pool" (the default)
# and "token flattening"; `--variant` also accepts the `aliases`.
default_variant:
  description: >
    mean-pool: each trial's patch tokens averaged into one vector, with this
    reader's own band (no confound filtering here)
  paper: the mean-pool results of App. D.8 (Fig. 26)
variants:
  token_flattening:
    aliases: [per_patch]
    description: >
      token flattening: a trial's patch tokens are concatenated in token order
      into one vector (tokens x dimension) instead of averaged
    paper: >
      Fig. 23 (ERP), the no-filtering bars (per-patch embeddings); the band
      here is this reader's, not each model's own
    embed: --pooling per_patch
    probe: --pooling per_patch --set n_folds=loso --probe-type linear --class-weight balanced --tune-c 1.0 --max-iter 1000
