schema_version: 1
name: sleep_arousal
title: Microarousal detection
domain: sleep
question: Does a 30 s epoch contain a microarousal?
paper: App. C.2
embed: --set window_s=30 --set stride_s=30
probe: --probe-type linear --class-weight balanced --tune-c 1.0
datasets:
  # embed: "" -- fixed 30 s scoring epochs; these readers take no window arguments
  - {slug: mass, task: mass_arousal, note: "subset SS01, the only one with arousal annotations", embed: ""}
  - {slug: physionet2026, task: arousal, embed: ""}
single: mass
# Model families this benchmark does not evaluate: `-m all`, a group or an
# alias leaves them out; naming one is refused.
excluded_models:
  - families: [eegnetv4]
    reason: >
      motor-imagery checkpoints, which the paper evaluates on motor imagery
      only
  - families: [deepsoz_hem, seizure_transformer]
    reason: >
      seizure-detection models, which the paper reports on epilepsy only
metrics:
  # AUPRC at the 3 s threshold, as paper v2 reports arousal (Fig. 3c, 17a).
  # Every number of a row is read from that one probe of each fold; a fold
  # whose 3 s probe was not fitted (one class only) is n/a, never another
  # threshold's number.
  headline: auprc
  at: 3.0s
  higher_is_better: true
  secondary: [macro_f1, balanced_accuracy, auroc]
  unit: 30 s epoch
  describe: >
    AUPRC over 30 s epochs, positive = more than 3 s of scored arousal in the
    epoch, each fold's test subjects pooled
  fold: 5 subject-level folds; logistic regression, balanced loss, C = 1
  spread: population SD over the folds
