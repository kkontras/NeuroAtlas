notes:
  eegpt: Same bipolar→unipolar approximations. Paper pretrained unipolar at 58 channels; these are coarse approximations.
  labram: Same bipolar→unipolar approximations; shared vocabulary with NeuroLM.
  neurolm: Same bipolar→unipolar approximations.
  reve: Same bipolar→unipolar approximations; uses mixed-case per REVE position bank.
  steegformer: Same bipolar→unipolar approximations; mixed-case per STEEGFORMER_CHANNEL_MAP vocabulary (Fp1 not FP1, Fz not FZ).
  neurorvq: Same bipolar→unipolar approximations.
  neurogpt: "Dreem headband: monopolar channels identity-mapped, bipolars \u2192 dominant anchor. 6 duplicate targets (e.g. FP1 monopolar + FP1-F3 bipolar both \u2192 FP1); wrapper keeps first-listed. 9/22 unique slots filled."
  biot: 'Monopolar channels → uppercase 10-20 names; native bipolars FP1-F3/FP2-F4 kept as direct BIOT slot matches. Other DOD bipolars (F3-F4, F3-O1, etc.) passed through but ignored by wrapper. DOD-H:
    2 direct + 1 derivation + 4 approx. DOD-O: 1 derivation + 8 approx.'
  sleepfm: SleepFM is channel-label-agnostic (no position embedding); all channels passed through, wrapper pads to 10 BAS slots.
  chronos: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  moment: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  timemoe: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  moirai: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  lagllama: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  timesfm: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  core_sleep: Single-channel; wrapper selects C4 > C3 > Fpz-Cz by name preference.
  sleep_transformer: Single-channel; wrapper selects C4 > C3 > Fpz-Cz by name preference.
  sleepyco: Single-channel; wrapper selects C4 > C3 > Fpz-Cz by name preference.
