notes:
  eegpt: BCI EEG → referential 10-20 anchors; uppercased.
  cbramod: CBraMod is index-based; channel labels passed through unchanged.
  labram: BCI EEG → standard_1020 referential anchors; uppercased.
  neurolm: BCI EEG → uppercase 10-20 names per NeuroLM vocabulary.
  reve: BCI EEG → 10-20 names per REVE position bank.
  biot: BCI channels → uppercase 10-20 names.
  sleepfm: SleepFM is channel-label-agnostic; channels passed through unchanged.
  chronos: Univariate TS FM; channel names unused. Identity mapping.
  moment: Univariate TS FM; channel names unused. Identity mapping.
  moirai: Univariate TS FM; channel names unused. Identity mapping.
  core_sleep: Identity mapping; backbone selects C4.
  sleep_transformer: Identity mapping; backbone selects C4.
  sleepyco: Identity mapping; backbone selects C4.
  eegnetv4: "Not run on DREAMER's 14-channel Emotiv cap: EEGNetv4 reads C3, Cz and C4, and none of them is a channel here."
  neurogpt: "NeuroGPT places the 10-20 names on its 22-channel layout itself (T7, T8, P7, P8 on its T3, T4, T5, T6 slots); AF3, AF4, FC5 and FC6 have no slot there and are left out: 10 of 22 filled."
  neurorvq: "NeuroRVQ looks the 10-20 names up in its vocabulary itself, ignoring case; every channel is in it."
  steegformer: "S-TEEGformer looks the 10-20 names up in its vocabulary itself, ignoring case; every channel is in it."
