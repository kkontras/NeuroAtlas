notes:
  eegpt: Bipolar midline onto referential FPZ/PZ; paper pretrained unipolar, bipolar → nearest-electrode is an approximation.
  cbramod: CBraMod is index-based and permutation-invariant across channels; pass the original bipolar label through unchanged.
  labram: Bipolar midline onto standard_1020 referential names; shared vocabulary with NeuroLM.
  neurolm: Uppercase per NeuroLM standard_1020 vocabulary.
  reve: Lowercase 10-20 names per REVE position bank.
  steegformer: Bipolar midline onto referential Fpz/Pz; mixed-case per STEEGFORMER_CHANNEL_MAP vocabulary.
  neurorvq: Bipolar midline onto referential Fpz/Pz anchors in NeuroRVQ's 99-ch vocabulary.
  neurogpt: Bipolar midline onto FZ/PZ referential slots in NeuroGPT's legacy 10-20 layout (match-ratio 2/22).
  biot: 2 midline bipolars mapped to nearest BIOT double-banana slots (Fpz-Cz→FP1-F3 frontal, Pz-Oz→P3-O1 posterior). 14/16 slots zero-padded — very poor coverage.
  sleepfm: SleepFM is channel-label-agnostic (no position embedding); all channels passed through, wrapper pads to 10 BAS slots.
  chronos: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  moment: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  moirai: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
