notes:
  eegpt: Linked-mastoid bipolars → referential 10-20 anchors. Paper pretrained unipolar; the bipolar→unipolar mapping is an approximation.
  labram: Linked-mastoid bipolars → standard_1020 referential anchors.
  neurolm: Linked-mastoid bipolars → referential 10-20 anchors.
  reve: Linked-mastoid bipolars → lowercase 10-20 names per REVE position bank.
  steegformer: Linked-mastoid bipolars → referential 10-20 anchors; mixed-case per STEEGFORMER_CHANNEL_MAP (Cz not CZ, Pz not PZ).
  neurorvq: Linked-mastoid bipolars → referential 10-20 anchors.
  neurogpt: Linked-mastoid bipolars → referential 10-20 anchors in NeuroGPT's legacy layout (match-ratio 8/22).
  biot: 8 monopolar channels → uppercase 10-20 names (CZ/PZ not in derivation table). Up to 2 derivations (F3-C3, F4-C4) + 8 approx + 6 zero-padded when all channels present. Most recordings (59%) have
    only C3+O1 → 4 approx, 12 zero-padded. Reference-alias fallback tries M1/AVG when M2 not found.
  sleepfm: SleepFM is channel-label-agnostic (no position embedding); all channels passed through, wrapper pads to 10 BAS slots.
  chronos: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  moment: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  timemoe: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  moirai: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  core_sleep: Single-channel; wrapper selects C4 > C3 > Fpz-Cz by name preference.
  sleep_transformer: Single-channel; wrapper selects C4 > C3 > Fpz-Cz by name preference.
  sleepyco: Single-channel; wrapper selects C4 > C3 > Fpz-Cz by name preference.
  lagllama: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
  timesfm: Univariate TS FM; channel names unused (mean-pooled). Identity mapping.
