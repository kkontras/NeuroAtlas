# Dataset manifest schema
#
# One manifest per dataset, at datasets/<slug>/cohort.yaml.  It is the single
# home for every *fact* about a cohort.  Code lives in src/ and is parameterised
# by these values; it never restates them.
#
# The rule that decides whether something belongs here:
#
#     Could this value differ between two DATASETS?   -> here
#     Could it differ between two MODELS?             -> CheckpointSpec
#     Is it a choice about how we evaluate, shared
#       across datasets?                              -> protocols/<name>.yaml
#     Is it behaviour?                                -> src/, taking its
#                                                        parameters from here
#
# A manifest is data only.  No paths to a particular machine, no code, no
# conditionals.  If you find yourself wanting an `if` here, it belongs in the
# adapter.
#
# Fields marked REQUIRED must be present for every dataset in the paper's 43;
# The internal test suite enforces that.

schema_version: 1

fields:

  # -- identity --------------------------------------------------------------
  slug:
    required: true
    type: str
    doc: >
      Registry key. Must match the directory name and the DatasetSpec slug.
      Lower snake_case. This is the string users type after --dataset.
  name:
    required: true
    type: str
    doc: Human-readable name as the source publication writes it.
  domain:
    required: true
    enum: [epilepsy, sleep, brain_age, bci]
    doc: Which of the benchmark's four lines this cohort belongs to.
  description:
    required: true
    type: str
    doc: >
      One paragraph, shown by `--list-datasets`. State the task, the signal
      (channels, montage, rate), the cohort size, and the evaluation grouping.
  paper_dataset:
    required: true
    type: bool
    doc: >
      True for the 43 cohorts the paper reports. False for the ~150 MOABB
      datasets the registry can additionally load. Reporting tools filter on it.

  # -- cohort ----------------------------------------------------------------
  cohort:
    required: true
    type: map
    doc: >
      Facts about the recordings themselves. Only `powerline_hz` affects
      behaviour; the rest is provenance and is surfaced in the generated README.
    keys:
      centre:       {type: str,  doc: "Recording site, as it should be cited."}
      country:      {type: str,  doc: "ISO-3166 alpha-2. Determines powerline_hz."}
      powerline_hz: {type: float, required: true,
                     doc: "50 or 60. THE source for the notch frequency — the
                           preprocessing pipeline reads this and nothing else."}
      n_subjects:   {type: int}
      n_recordings: {type: int}
      hours:        {type: float}
      population:   {type: str, doc: "e.g. paediatric, adult, neonatal."}
      note:         {type: str, doc: "Anything a user must know before using it."}

  # -- acquisition -----------------------------------------------------------
  acquisition:
    required: true
    type: map
    doc: >
      How to obtain the raw corpus. `fetch --dataset X` dispatches on `kind`,
      and the paper's dataset table is the external reference for it.
    keys:
      kind:     {type: str, required: true,
                 enum: [zenodo, physionet, moabb, nsrr, tuh, figshare, mendeley,
                        url, manual, internal],
                 doc: "internal = not publicly licensed; manual = a person has to
                       fetch it (a request, a licence, a login, or no API);
                       url = plain files at fixed addresses (see `files`)."}
      ref:      {type: str, doc: "Record id / repo id / accession for `kind`."}
      file:     {type: str, doc: "zenodo: the one archive to fetch and unpack. Without
                                  `file` or `files`, every file of the record is
                                  fetched into the raw folder (helsinki_neonatal)."}
      files:    {type: list, doc: "zenodo: several archives of the record to fetch and
                                  unpack. url: [{url, md5}] -- each is fetched and,
                                  when a zip, unpacked into the raw folder."}
      upstream: {type: str, doc: "Canonical landing page for a human. Only addresses
                                  someone has opened belong here."}
      size_gb:  {type: float, doc: "What a download transfers, in GB (1e9 bytes). Leave
                                  it out when unknown rather than guess."}
      checksum: {type: str, doc: "md5:… or sha256:… of the archive. 'TBD' is allowed but
                                  reported by the completeness test. Zenodo
                                  downloads are also verified against the md5s the
                                  record's API publishes."}
      version:  {type: str, doc: "Release to fetch, for kinds whose URLs carry one
                                  (physionet: files/<ref>/<version>/)."}
      subdir:   {type: str, doc: "Where, inside what `data download` fetches, the
                                  reader's path points (hmc reads recordings/)."}
      dest:     {type: str, doc: "Where `data download` puts the raw corpus when the
                                  reader itself reads no raw path (eegmat reads a
                                  prepared pickle)."}
      expect:   {type: map, doc: "What `data status` counts as the corpus being there:
                                  {glob: 'SN[0-9][0-9][0-9].edf', count: N}. The glob is
                                  matched against file names anywhere under the raw
                                  path; fewer than `count` files is `partial (n/N)`.
                                  `min: N` (older form) is a lower bound with no
                                  total. Without it, any EEG file counts."}
      nemar:    {type: str, doc: "moabb: the NEMAR deposit MOABB downloads into
                                  $MNE_DATA/NEMAR/<id>, which `data status` checks."}
      moabb_folder:
                {type: str, doc: "moabb: the folder under $MNE_DATA that moabb 1.2.0
                                  (the numpy<2 stack) downloads this cohort into;
                                  `data status` checks it when NEMAR/<id> (moabb 1.6+)
                                  is absent."}
      prepared_only:
                {type: str, doc: "The reader reads only a prepared file nothing in
                                  this repository builds; `data status` says so and
                                  `data prepare` refuses with this text."}
      unusable_download:
                {type: str, doc: "What the upstream serves is not what the reader
                                  reads; `data download` refuses with this text."}
      note:     {type: str, doc: "Anything a person fetching it must know: access
                                  terms, and the folder layout the reader expects."}

  # -- signal ----------------------------------------------------------------
  signal:
    required: true
    type: map
    doc: What the loader produces, before any model-specific transform.
    keys:
      montage:   {type: str, doc: "bipolar | unipolar | dataset-specific name."}
      montage_rationale:
                 {type: str,
                  doc: "REQUIRED whenever montage is not the obvious choice.
                        This is the field that carries *why*, which is what was
                        being lost in the entrypoints."}
      sampling_rate_hz: {type: float, doc: "Native rate, before any resampling."}
      notch_freq:
                 {type: float,
                  doc: "Powerline notch the pipeline ACTUALLY applies, or null.
                        Deliberately separate from cohort.powerline_hz: that is
                        a fact about the site, this is behaviour — setting it
                        makes DatasetSpec.build_config inject `notch` and
                        `highpass` into every run. Most epilepsy datasets leave
                        it null today. Unifying them is gated on audit OQ-3.2."}
      window_s:  {type: float, doc: "null when the dataset is pre-segmented."}
      stride_s:  {type: float, doc: "null = non-overlapping (stride = window)."}
      overlap_threshold:
                 {type: float, doc: "Fraction of a window that must overlap an
                                     event for a positive label."}
      channels:  {type: list, doc: "Explicit channel list when the dataset has
                                    one fixed set."}

  # -- labels ----------------------------------------------------------------
  labels:
    required: true
    type: map
    doc: >
      Every label mode this dataset supports. `default` is what runs when
      --set label_mode=... is not given. Each mode names its classes; a mode
      whose assignment needs an algorithm states the rule and points at the
      implementation.
    keys:
      default: {type: str, required: true}
      granularity:
        type: str
        required: true
        enum: [window, recording, trial, clip]
        doc: >
          What one label describes. This is the difference between "binary"
          meaning seizure-vs-background for each 10 s window (window) and
          abnormal-vs-normal for a whole recording (recording). It decides
          whether window scores are aggregated before scoring, so a reader who
          does not know it cannot interpret the reported numbers.
          This is the DEFAULT mode's value; a mode that differs declares its
          own under modes.<name>.granularity. ISRUC is the example: sleep_stage
          is per 30 s epoch, diagnosis is one label for the whole recording.
      modes:
        type: map
        doc: >
          mode name -> {classes | classes_from, rule, note}. `rule` names a
          function in the dataio; it is a pointer, not a description, so it
          cannot drift from the code silently.
      also_implemented:
        type: list
        doc: >
          Modes the loader accepts but no shipped config, preset or launcher
          sets. Recorded so the capability is not lost; deliberately NOT
          offered by `--help`, because an option nobody runs reads as a
          recommendation.

  # -- splits ----------------------------------------------------------------
  splits:
    required: true
    type: map
    keys:
      manifest: {type: str, doc: "Path relative to this directory, or null."}
      grouping: {type: str, required: true, enum: [patient, recording, clip, session],
                 doc: "The unit that must not straddle a split. 'recording' is
                       only correct when one recording == one subject."}
      n_folds:  {type: int}
      mode:     {type: str, doc: "e.g. TUAB's 'official' vs 'kfold'."}
      derivation:
                {type: str,
                 doc: "REQUIRED when `manifest` is null: how the folds are
                       computed at load time, including the seed. Without it,
                       an n_folds with no file behind it is an unkeepable
                       promise — a reader cannot tell whether the split is
                       reproducible."}
      derived_by:
                {type: str, doc: "file:line of the splitter `derivation`
                                  describes, so the two cannot drift."}
      manifest_note:
                {type: str, doc: "Counterpart for a dataset that DOES ship a
                                  manifest, when it sits among cohorts that
                                  do not."}
      note:     {type: str}

  # -- pipeline --------------------------------------------------------------
  pipeline:
    type: map
    doc: Which shared machinery this dataset needs.
    keys:
      recording_stats:
        type: str
        enum: [eager, streaming, via_dataio, none]
        doc: >
          How per-recording amplitude statistics are computed.
          eager = read the whole recording; streaming = two-pass over blocks
          (for recordings too long to hold); via_dataio = the dataio writes the
          cache itself on first access.
      preprocessor:
        type: str
        doc: "Name of the cache builder in datasets/preprocessors, or null."
      required:
        type: bool
        doc: >
          For a MOABB cohort with a preprocessor: false when nothing the
          benchmark runs reads what it builds, so `data status`, `check` and
          `show` treat the cohort by its raw data and `prepare` lists the
          builder as optional. Default true.
      cache_layout:
        type: str
        doc: "Short description of what the preprocessor writes."

  # -- runtime defaults ------------------------------------------------------
  runtime_defaults:
    type: map
    doc: >
      Passed verbatim into the datamodule constructor. These become
      DatasetSpec.config_defaults, so the keys must match the adapter's
      __init__ signature. Anything here is overridable with `--set k=v`.

  # -- backends --------------------------------------------------------------
  backends:
    type: map
    doc: >
      Present only when one cohort has more than one loader. Each entry is
      a backend name -> {loader, reads, note, defaults, unsupported,
      recording_stats}. `defaults` replaces runtime_defaults when that backend
      is chosen; `unsupported` lists the runtime_defaults keys it cannot take,
      which the factory drops rather than passing on to fail inside a
      constructor. Two loaders over the same corpus are ONE dataset — this
      block exists so they stop being registered as two.

  # -- runtime options -------------------------------------------------------
  runtime_options:
    type: map
    doc: >
      Allowed values for the enumerable runtime_defaults keys, as
      key -> {values, enforced_by}. `--dataset X --help` prints these, so a
      user sees the choices rather than only the current value. `enforced_by`
      names the code that validates them, so a value listed here that the code
      rejects is a bug in one place, not two.

  # -- spec plumbing ---------------------------------------------------------
  spec:
    type: map
    doc: Values that map onto DatasetSpec fields other than config_defaults.
    keys:
      datamodule:            {type: str, doc: "Dotted path to the datamodule
                                       class this cohort constructs, e.g.
                                       neuroatlas.extensions.datasets.adapters.ucddb.UCDDBBenchmarkDataModule.
                                       Resolved on first use by
                                       extensions/datasets/_manifest_specs.py.
                                       Omit it only when the binding is not a
                                       constant -- a backend switch, a wrapped
                                       callable, or a generated family -- in
                                       which case the cohort keeps its own
                                       module under extensions/datasets/."}
      default_task:          {type: str}
      supports_folds:        {type: bool}
      input_kind_signal_map: {type: map}
      metadata_keys:         {type: list}

  # -- provenance ------------------------------------------------------------
  provenance:
    type: map
    keys:
      added:         {type: str, doc: "ISO date."}
      last_verified: {type: str, doc: "ISO date this manifest was checked
                                       against the data and the code."}
      migrated_from: {type: list, doc: "Files this manifest consolidated.
                                        Kept so the audit trail survives."}
