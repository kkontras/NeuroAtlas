# arithmetic_task — dataset manifest
#
# Schema: _schema.yaml
# Facts read from the preprocessing script that produced this cohort's pickles
# and from the pickles themselves; see provenance below.

schema_version: 1

slug: arithmetic_task
name: ArithmeticTask
domain: bci
paper_dataset: true

description: >
  In-house arithmetic-stress recordings over two experiments: rest, mental
  arithmetic, and a meditation or breathing control.

cohort:
  centre: "KU Leuven, Belgium"
  country: BE
  powerline_hz: 50

acquisition:
  # The OSF release (CC0 1.0): one zip holding Experiment 1.zip and
  # Experiment 2.zip, flat EDFs (S01R.edf, S2A.edf); `data download` unpacks
  # both. `neuroatlas data prepare arithmetic_task` builds the files the
  # reader reads from them.
  kind: url
  upstream: https://osf.io/gh6q3/
  files:
    - {url: "https://osf.io/download/guzqm/", name: "Raw EEG data.zip", md5: 52e43bc036d795486683282a4351a8f6}
  size_gb: 0.71                             # 713,601,804 bytes (OSF, 2026-10-08)
  dest: ${EEG_DATA_ROOT}/arithmetic_task
  expect: {glob: "*.edf", count: 159}       # Experiment 1: 21 x 3, Experiment 2: 32 x 3

signal:
  notch_freq: 50.0

labels:
  granularity: trial
  default: trial_class
  modes:
    trial_class:
      note: >
        rest=0, arithmetic=1, meditation/breathing=2, per
        the upstream preprocessing. Experiment 1 recorded meditation, experiment
        2 breathing; both map to 2. The release holds 53 subjects; the files
        hold 45, the cohort's list: experiment 1's S01-S21 and experiment 2's
        S10-S33, the subjects the published embeddings and probes were built
        from.

splits:
  derivation: >
    subjects are permuted once with numpy RandomState(42) and cut into
    n_folds chunks: chunk `fold` is test, chunk `fold+1` is validation, the
    rest is train
  derived_by: src/neuroatlas/extensions/datasets/dataio/bci.py (get_subject_split)
  manifest: null
  grouping: patient
  n_folds: 5

pipeline:
  # `neuroatlas data prepare arithmetic_task` builds the two files the reader reads
  # (no filtering, confound filtering) from the raw data, into
  # <cache root>/prepared/arithmetic_task/.
  preprocessor:
    module: neuroatlas.extensions.datasets.preprocessors.preprocess_cognitive
    args:
      slug: --dataset
      raw: --raw-dir
      out: --output

runtime_defaults:
  batch_size: 64
  preprocessed_path: null              # `config set arithmetic_task.preprocessed_path FILE`
  fold: 0
  n_folds: 5
  num_workers: 0

runtime_options:
  # Confound filtering (App. D.6): `--set confound_control=true` on `embed`
  # and `probe`, as the bci_cognitive benchmark's default passes it;
  # `--set confound_control=false` is its no_filtering variant.
  confound_control:
    default: false
    effect: >
      reads ArithmeticTask_preprocessed_trackD_*.pkl, the file filtered 4-40 Hz, instead of ArithmeticTask_preprocessed_*.pkl. A file whose recorded
      band is the other one is refused. The two are cached separately.
    implemented_by: extensions/datasets/adapters/cognitive.py

spec:
  datamodule: neuroatlas.extensions.datasets.adapters.cognitive.ArithmeticTaskBenchmarkDataModule
  default_task: linear_probe
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: raw
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - signal_kind
    - fold

provenance:
  last_verified: 2026-09-30
  note: >
    45 subjects, 1.0 s windows, resampled to 128 Hz. Classes: rest (0), arithmetic (1), meditation_breathing (2).
    Labels read from the upstream preprocessing rather than inferred from the
    stored integers.
