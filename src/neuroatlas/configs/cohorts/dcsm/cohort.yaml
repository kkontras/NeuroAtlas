# dcsm — dataset manifest
#
# Schema: datasets/_schema.yaml
# First generated from the hand-written DatasetSpec this cohort used to have,
# plus the constants its per-dataset entrypoint pinned; hand-maintained since.
# Edit this file, not the spec module, which only binds the manifest to a
# datamodule.

schema_version: 1

slug: dcsm
name: Dcsm
domain: sleep
paper_dataset: true

description: >
  Danish Center for Sleep Medicine (DCSM) benchmark adapter.

cohort:
  centre: "Danish Center for Sleep Medicine, Denmark"
  country: DK
  powerline_hz: 50

acquisition:
  kind: manual

signal:
  notch_freq: 50.0

labels:
  granularity: window
  # one label per window — this is the DEFAULT mode's granularity;
  # a mode that differs says so under modes.<name>.granularity
  default: sleep_stage
  modes:
    sleep_stage:
      classes:
        - W
        - N1
        - N2
        - N3
        - REM
      note: 5-class AASM staging per 30 s epoch
splits:
  manifest: folds.json
  grouping: patient
  n_folds: 5

runtime_defaults:
  batch_size: 32
  data_root: "${EEG_DATA_ROOT}/data/raw/dcsm/data/sleep/DCSM"
  num_folds: 5
  signal_kind: raw

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: neuroatlas.extensions.datasets.adapters.dcsm.DCSMBenchmarkDataModule
  default_task: linear_probe
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: raw
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - signal_kind
    - fold
    - num_folds

provenance:
  last_verified: 2026-09-21
