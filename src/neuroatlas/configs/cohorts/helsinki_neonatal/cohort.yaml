# helsinki_neonatal — dataset manifest
#
# Schema: datasets/_schema.yaml
# First generated from the hand-written DatasetSpec this cohort used to have,
# plus the constants its per-dataset entrypoint pinned; hand-maintained since.
# Edit this file, not the spec module, which only binds the manifest to a
# datamodule.

schema_version: 1

slug: helsinki_neonatal
name: Helsinki neonatal EEG with seizure annotations
domain: epilepsy
paper_dataset: true

description: >
  Helsinki Neonatal EEG Dataset (Stevenson 2019): binary seizure detection
  from 19-channel unipolar EEG at 256 Hz. 79 neonates, three independent
  expert annotations (A/B/C); the label is the majority (at least 2 of 3),
  and each expert's window labels are kept too. Patient-level k-fold
  evaluation.

cohort:
  centre: "Helsinki University Central Hospital, Finland"
  country: FI
  powerline_hz: 50
  population: neonatal

acquisition:
  kind: zenodo
  ref: "4940267"
  # No `file`: the record is 85 loose files (79 EDFs + annotations and
  # clinical sheets), all of which the loader reads from one folder.
  upstream: https://zenodo.org/records/4940267
  size_gb: 4.3                              # Zenodo API: 85 files, 4.337 GB (2026-10-02)
  expect: {glob: "eeg*.edf", count: 79}

signal:
  montage: unipolar
  window_s: 10.0
  stride_s: null
  overlap_threshold: 0.0
  notch_freq: null

labels:
  granularity: window
  # one label per window; event-level metrics (any-overlap, FA/h) are computed on top of the window scores
  default: binary
  modes:
    binary: {}

splits:
  derivation: >
    StratifiedKFold(shuffle=True, random_state=`seed`) over sorted patient
    ids; folds capped at the patient count
  derived_by: src/neuroatlas/extensions/datasets/adapters/helsinki_neonatal.py:91
  # No fold manifest: there is no file to inspect, but the split is
  # reproducible because the splitter is seeded and the subject order
  # is sorted.
  manifest: null
  grouping: patient
  n_folds: 5

runtime_defaults:
  backend: edf
  balance: weighted_sampler
  batch_size: 64
  consensus: majority
  fold: 0
  include_partial_subjects: true
  label_mode: binary
  montage: unipolar
  n_folds: 5
  normalize: none
  num_workers: 4
  overlap_threshold: 0.0
  raw_root: "${EEG_DATA_ROOT}/helsinki_neonatal"
  seed: 42
  stride_s: null
  window_s: 10.0


# Allowed values for the enumerable --set keys, and where the code
# enforces them. Surfaced by `--dataset <slug> --help`.
runtime_options:
  montage:
    values:
      - bipolar
      - unipolar
    enforced_by: dataio.helsinki_neonatal

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: neuroatlas.extensions.datasets.adapters.helsinki_neonatal.HelsinkiNeonatalBenchmarkDataModule
  default_task: seizure_detection
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: eeg
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - signal_kind
    - fold
    - n_folds
    - consensus

provenance:
  last_verified: 2026-09-21
