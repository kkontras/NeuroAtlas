# hinss2021 — dataset manifest
#
# Schema: datasets/_schema.yaml
# First generated from the hand-written DatasetSpec this cohort used to have,
# plus the constants its per-dataset entrypoint pinned; hand-maintained since.
# Edit this file, not the spec module, which only binds the manifest to a
# datamodule.

schema_version: 1

slug: hinss2021
name: Hinss2021
domain: bci
paper_dataset: false

description: >
  Hinss2021 cognitive-workload benchmark (4-class: easy, medium,
  difficult, rest).

cohort:
  centre: "ISAE-SUPAERO, France"
  country: FR
  powerline_hz: 50

acquisition:
  kind: moabb
  ref: Hinss2021

signal:
  notch_freq: null

labels:
  granularity: trial
  # one label per trial (a cue-locked epoch), which is the unit the BCI protocols score — this is the DEFAULT mode's granularity;
  # a mode that differs says so under modes.<name>.granularity
  default: trial_class
  modes:
    trial_class:
      note: the dataset's own trial classes; see BCIDatasetConfig.targets in dataio/bci.py
splits:
  derivation: >
    subjects are permuted once with numpy RandomState(42) and cut into
    n_folds chunks: chunk `fold` is test, chunk `fold+1` is validation, the
    rest is train. No stratification — MOABB cohorts are class-balanced by
    design
  derived_by: src/neuroatlas/extensions/datasets/dataio/bci.py:2014-2042 (get_subject_split)
  # No fold manifest: reproducible because the splitter is seeded,
  # but there is no file to inspect or to pin across repo versions.
  manifest: null
  grouping: patient
  n_folds: 5

runtime_defaults:
  batch_size: 64
  fold: 0
  n_folds: 5
  n_jobs: 1
  num_workers: 0

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: neuroatlas.extensions.datasets.adapters.hinss2021.Hinss2021BenchmarkDataModule
  default_task: linear_probe
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: raw
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - signal_kind
    - fold

provenance:
  last_verified: 2026-09-21
