# hmc — dataset manifest
#
# Schema: datasets/_schema.yaml
# Written by hand 2026-09-27, not by the manifest migration (retired):
# this cohort had an adapter but never a DatasetSpec, so there was no
# pre-migration spec to migrate from. Facts come from the paper (App. B.2),
# the paper's dataset table, src/neuroatlas/configs/folds/hmc.json and the adapter itself.

schema_version: 1

slug: hmc
name: HMC Sleep Staging
domain: sleep
paper_dataset: true          # App. B.2, one of the 15 sleep cohorts; paper [2]

description: >
  Haaglanden Medisch Centrum sleep staging database: clinical PSG from a
  Dutch tertiary hospital, scored to AASM five-stage.

cohort:
  centre: "Haaglanden Medisch Centrum, The Hague, Netherlands"
  country: NL
  powerline_hz: 50

acquisition:
  kind: physionet
  ref: hmc-sleep-staging
  version: "1.1"
  subdir: recordings
  size_gb: 15.7                        # the project page's total uncompressed size
  expect: {glob: "SN[0-9][0-9][0-9].edf", count: 151}   # RECORDS: 151 recordings

signal:
  notch_freq: 50.0

labels:
  granularity: window
  # one label per window — this is the DEFAULT mode's granularity;
  # a mode that differs says so under modes.<name>.granularity
  default: sleep_stage
  modes:
    sleep_stage:
      classes: [W, N1, N2, N3, REM]
      note: 5-class AASM staging per 30 s epoch
      implemented_by: adapters.hmc

splits:
  # Points at the single copy under src/neuroatlas/configs/folds/ rather than a duplicate
  # here -- both live under configs/, so this is a sibling directory. Ten cohorts keep both, and Sleep-EDF showed where that
  # ends: src/neuroatlas/configs/folds/sleepedf.json and the dossier copy drifted apart and
  # one of them leaked. fold_manifest_path resolves this relative to the
  # dossier, and load_fold_split finds the same file by its own search order.
  manifest: ../../folds/hmc.json
  derivation: >
    5-fold patient-level partition, frozen. folds["k"] is fold k's test
    group; val is group k+1 and train is the rest, the rule
    fold_manifest.py calls `partition`. Verified: the five test groups are
    disjoint and together cover all 151 subjects, with no train/test or
    train/val overlap in any fold.
  derived_by: src/neuroatlas/extensions/datasets/adapters/physioex_base.py  # _resolve_splits
  grouping: patient
  n_folds: 5
  n_subjects: 151

pipeline:
  # No prepare step: the adapter reads the PhysioNet EDFs as they are.
  preprocessor: null

runtime_defaults:
  # The physioex loader globs `<root>/<subject>.edf` plus
  # `<subject>_sleepscoring.edf`, so the root is the `recordings/`
  # subdirectory, not the release root above it.
  data_root: "${EEG_DATA_ROOT}/data/Guido/hmc/physionet.org/files/hmc-sleep-staging/1.1/recordings"
  batch_size: 8
  num_workers: 0
  fold: 0
  n_folds: 5                    # the manifest's five folds: `run` probes all five, as the paper did
  signal_kind: raw
  pipeline_name: legacy

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: neuroatlas.extensions.datasets.adapters.hmc.HMCBenchmarkDataModule
  default_task: linear_probe
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: raw
  metadata_keys: [fold, signal_kind, pipeline_name]

provenance:
  # Nothing here has been run: HMC's corpus is not on the machine this was
  # written on; `provenance.last_verified: null` below is the record.
  last_verified: null
  known_issues:
    - "Never loaded. The 4 EEG channels and their 10-20 names come from
       adapters/hmc.py, the data_root from configs/dataset_paths_sofia.yaml;
       neither has been checked against the corpus."
    - "The fold manifest's ids (SN003, SN009, ...) have not been matched
       against the subject ids the loader discovers. A mismatch raises
       rather than falling back to a random split (physioex_base
       _resolve_splits), so it will be loud, but it has not been seen to
       pass."
