# mesa — dataset manifest
#
# Schema: datasets/_schema.yaml
# Written by hand 2026-09-27; adapter existed, DatasetSpec did not.

schema_version: 1

slug: mesa
name: MESA (Multi-Ethnic Study of Atherosclerosis)
domain: sleep
paper_dataset: true          # App. B.2, one of the 15 sleep cohorts; paper [15,101]

description: >
  Multi-Ethnic Study of Atherosclerosis sleep exam: at-home polysomnography
  from a population cohort, and the largest sleep corpus in the benchmark at
  2056 recordings.

cohort:
  centre: "Multi-centre population cohort (NSRR mesa), USA"
  country: US
  powerline_hz: 60

acquisition:
  kind: nsrr
  ref: mesa

signal:
  notch_freq: 60.0

labels:
  granularity: window
  # one label per window — this is the DEFAULT mode's granularity;
  # a mode that differs says so under modes.<name>.granularity
  default: sleep_stage
  modes:
    sleep_stage:
      classes: [W, N1, N2, N3, REM]
      note: 5-class AASM staging per 30 s epoch
      implemented_by: adapters.mesa

splits:
  # Points at the single copy under src/neuroatlas/configs/folds/ rather than a duplicate
  # here -- both live under configs/, so this is a sibling directory. Ten cohorts keep both, and Sleep-EDF showed where that
  # ends: src/neuroatlas/configs/folds/sleepedf.json and the dossier copy drifted apart and
  # one of them leaked. fold_manifest_path resolves this relative to the
  # dossier, and load_fold_split finds the same file by its own search order.
  manifest: ../../folds/mesa.json
  derivation: >
    5-fold patient-level partition, frozen. folds["k"] is fold k's test
    group; val is group k+1 and train is the rest (fold_manifest.py's
    `partition` rule). Verified: the five test groups are disjoint and
    cover all 2056 subjects, with no train/test or train/val overlap.
  derived_by: src/neuroatlas/extensions/datasets/adapters/physioex_base.py  # _resolve_splits
  grouping: patient
  n_folds: 5
  n_subjects: 2056

pipeline:
  # No prepare step: the adapter reads the NSRR EDFs as they are.
  preprocessor: null

runtime_defaults:
  data_root: "${EEG_DATA_ROOT}/data/Guido/mesa/polysomnography/edfs"
  batch_size: 8
  num_workers: 0
  fold: 0
  signal_kind: raw
  pipeline_name: legacy

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: neuroatlas.extensions.datasets.adapters.mesa.MESABenchmarkDataModule
  default_task: linear_probe
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: raw
  metadata_keys: [fold, signal_kind, pipeline_name]

provenance:
  last_verified: null
  known_issues:
    - "Never loaded. MESA's corpus is not on the machine this was written on."
    - "2056 recordings makes this the benchmark's largest sleep cohort; the
       default batch_size of 8 and num_workers of 0 are the physioex base
       defaults, not a considered choice for a corpus this size."
    - "App. B.3 uses this cohort for brain age, but the loader carries no
       demographics, so there is no `age` label mode here and brain age
       cannot run on it. Adding it means joining the NSRR
       mesa-sleep-dataset-*.csv on subject id -- the same work SHHS needs."
