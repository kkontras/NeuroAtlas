# nmt — dataset manifest
#
# Schema: datasets/_schema.yaml
# First generated from the hand-written DatasetSpec this cohort used to have,
# plus the constants its per-dataset entrypoint pinned; hand-maintained since.
# Edit this file, not the spec module, which only binds the manifest to a
# datamodule.

schema_version: 1

slug: nmt
name: NMT Scalp EEG Dataset
domain: epilepsy
paper_dataset: true

description: >
  NMT Scalp EEG Dataset (NUST-SEECS, Pakistan): binary normal/abnormal
  classification from 19-channel scalp EEG at 200 Hz, resampled to 256 Hz.
  2,417 recordings, one per participant. The official train/eval split with
  a subject-disjoint validation set, or subject-stratified k-fold.

cohort:
  centre: "NUST-SEECS, Pakistan"
  country: PK
  powerline_hz: 50

acquisition:
  kind: manual
  upstream: "https://dll.seecs.nust.edu.pk/downloads/"   # not reachable from our network on 2026-10-02

signal:
  montage: unipolar
  window_s: 10.0
  stride_s: null
  notch_freq: null

labels:
  granularity: recording
  # one label per recording; window scores are aggregated to the recording before scoring
  default: binary
  modes:
    binary: {}

splits:
  derivation: >
    even in the default split_mode=official, n_folds matters: the official
    train/eval partition fixes the TEST set, and validation is carved out of
    the train partition with a single seeded StratifiedKFold pass over
    subjects, stratified on abnormal/normal (_train_val_subject_split, shared
    with TUAB). split_mode=kfold instead splits all subjects with
    StratifiedKFold(shuffle=True, random_state=`seed`, default 42).
  derived_by: src/neuroatlas/extensions/datasets/adapters/tuab.py:101-142
    (shared by nmt via adapters/nmt.py:192-223)
  # No fold manifest; reproducible because every splitter here is seeded.
  manifest: null
  grouping: patient
  n_folds: 5
  mode: official

runtime_defaults:
  balance: weighted_sampler
  batch_size: 64
  cache_max_recordings: 16
  fold: 0
  label_mode: binary
  n_folds: 5
  normalize: none
  num_workers: 4
  raw_root: "${EEG_DATA_ROOT}/nmt"
  seed: 42
  split_mode: official
  stride_s: null
  window_s: 10.0


# Allowed values for the enumerable --set keys, and where the code
# enforces them. Surfaced by `--dataset <slug> --help`.
runtime_options:
  montage:
    values:
      - bipolar
      - unipolar
    enforced_by: dataio.nmt
  split_mode:
    values:
      - official
      - kfold
    enforced_by: dataio.nmt

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: neuroatlas.extensions.datasets.adapters.nmt.NMTBenchmarkDataModule
  default_task: linear_probe
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: eeg
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - signal_kind
    - fold
    - n_folds

provenance:
  last_verified: 2026-09-21
