# physionet2026 — dataset manifest
#
# Schema: datasets/_schema.yaml
# First generated from the hand-written DatasetSpec this cohort used to have,
# plus the constants its per-dataset entrypoint pinned; hand-maintained since.
# Edit this file, not the spec module, which only binds the manifest to a
# datamodule.

schema_version: 1

slug: physionet2026
name: PhysioNet Challenge 2026 (Human Sleep Project)
domain: sleep
paper_dataset: true

description: >
  PhysioNet Challenge 2026 PSG adapter — sleep staging, arousals,
  respiratory events, limb movements, and cognitive impairment
  classification from 3 US sites (622 recordings, training set).

cohort:
  centre: PhysioNet Challenge 2026
  country: US
  powerline_hz: 60

acquisition:
  kind: manual
  upstream: https://physionetchallenges.org/2026/
  size_gb: 230                              # the small training set, 214 GiB (the Challenge page)
  note: >
    Not a PhysioNet files project: the Challenge data are Kaggle datasets and need a
    Kaggle account. The small version is
    https://www.kaggle.com/datasets/physionet/physionetchallenge2026data (214 GiB);
    the large one is 1.2 TiB. Point physionet2026.data_root at its training-set
    folder, which holds physiological_data/<site>/sub-<id>-ses<k>.edf.

signal:
  notch_freq: 60.0

labels:
  granularity: window
  # one label per window — this is the DEFAULT mode's granularity;
  # a mode that differs says so under modes.<name>.granularity
  default: sleep_stage
  modes:
    sleep_stage:
      implemented_by: adapters.physionet2026
    ci_label:
      granularity: recording   # one label for the whole recording; window scores are aggregated to the recording before scoring
      # The label the probe reads, derived by CI_TO_LABEL in
      # adapters/physionet2026.py:66. NOT `cognitive_impairment`, which is the
      # raw metadata field the record carries -- passing that name yields -1
      # for every epoch. src/neuroatlas/configs/tasks/cognitive.json uses ci_label.
      implemented_by: adapters.physionet2026
  # Implemented in the loader but not set by any shipped config, task
  # preset or launcher. Recorded so the capability is not lost; not
  # offered by --help, because an option nobody runs is noise.
    age:
      granularity: recording   # one age per subject; window predictions are mean-pooled to the subject before the ridge fit
      note: >
        chronological age in years; regression via `--task brain_age`
        (Appendix B.3 re-labels this cohort, it does not add a dataset)
      implemented_by: adapters.physionet2026._age_labels
  also_implemented:
    - sex
splits:
  manifest: folds.json
  grouping: patient
  n_folds: 5

runtime_defaults:
  batch_size: 32
  data_root: "${EEG_DATA_ROOT}/data/raw/physionetchallenge2026data/training_set"
  label_mode: sleep_stage
  num_folds: 5
  signal_kind: raw


# Allowed values for the enumerable --set keys, and where the code
# enforces them. Surfaced by `--dataset <slug> --help`.
runtime_options:
  label_mode:
    values:
      - sleep_stage
      - cognitive_impairment
    enforced_by: adapters.physionet2026

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: neuroatlas.extensions.datasets.adapters.physionet2026.PhysioNet2026BenchmarkDataModule
  default_task: linear_probe
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: raw
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - signal_kind
    - fold
    - num_folds
    - label_mode

provenance:
  last_verified: 2026-09-21
