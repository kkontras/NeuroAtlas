# sleep_edf — dataset manifest
#
# Schema: datasets/_schema.yaml
# First generated from the hand-written DatasetSpec this cohort used to have,
# plus the constants its per-dataset entrypoint pinned; hand-maintained since.
# Edit this file, not the spec module, which only binds the manifest to a
# datamodule.

schema_version: 1

slug: sleep_edf
name: Sleep Edf
domain: sleep
paper_dataset: false

description: >
  Sleep-EDF benchmark adapter for NPZ and PhysioEx-derived layouts.

cohort:
  centre: "Sleep-EDF (PhysioNet), Netherlands"
  country: NL
  powerline_hz: 50

acquisition:
  kind: physionet
  ref: sleep-edfx

signal:
  notch_freq: null

labels:
  granularity: window
  # one label per window — this is the DEFAULT mode's granularity;
  # a mode that differs says so under modes.<name>.granularity
  default: sleep_stage
  modes:
    sleep_stage:
      classes:
        - W
        - N1
        - N2
        - N3
        - REM
      note: 5-class AASM staging per 30 s epoch
splits:
  manifest: null
  grouping: patient

runtime_defaults:
  batch_size: 8
  data_format: npz


# Allowed values for the enumerable --set keys, and where the code
# enforces them. Surfaced by `--dataset <slug> --help`.
runtime_options:
  data_format:
    values:
      - npz
      - physioex
    enforced_by: dataio.sleep_edf
  signal_kind:
    values:
      - raw
      - xsleepnet
    enforced_by: dataio.sleep_edf

spec:
  default_task: linear_probe
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: raw
    time_frequency: xsleepnet
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - signal_kind
    - fold

provenance:
  last_verified: 2026-09-21
