# sz2 — dataset manifest
#
# Schema: datasets/_schema.yaml
# First generated from the hand-written DatasetSpec this cohort used to have,
# plus the constants its per-dataset entrypoint pinned; hand-maintained since.
# Edit this file, not the spec module, which only binds the manifest to a
# datamodule.

schema_version: 1

slug: sz2
name: SeizeIT2
domain: epilepsy
paper_dataset: true

description: >
  SeizeIT2: binary seizure detection from 19-channel unipolar EEG resampled
  to 256 Hz. Patient-level k-fold evaluation.

cohort:
  centre: "UZ Leuven, Belgium (SeizeIT2, 9 cohorts)"
  country: BE
  powerline_hz: 50

acquisition:
  kind: internal
  note: >
    A public BIDS release of SeizeIT2 exists on OpenNeuro (ds005873, v1.1.0,
    47.6 GB), but this reader expects the authors' internal layout
    (<path>/Anonymous_Hospital_Adult/...); it has not been checked against
    the public one.

signal:
  montage: unipolar
  window_s: 10.0
  overlap_threshold: 0.0
  notch_freq: null

labels:
  granularity: window
  # one label per window; event-level metrics (any-overlap, FA/h) are computed on top of the window scores
  default: binary
  modes:
    binary: {}

splits:
  manifest_note: >
    The paper's folds, frozen (3c6721c configs/folds/sz2.json): the paper's
    epilepsy probe drew them over 375 subjects stratified on "has any seizure
    window" (191 do). Both backends read this file (adapters/sz2.py
    _resolve_splits); the EDF reader's own splitter saw one class and drew
    other folds. A corpus with more subjects (a later extraction found 401)
    is refused; --set strict_folds=false runs on the 375, --set
    folds_manifest=none derives new folds (not the paper's).
  manifest: folds.json
  derived_by: src/neuroatlas/extensions/datasets/adapters/sz2.py  # _resolve_splits
  derivation: >
    folds_manifest=none only: StratifiedKFold(shuffle=True, random_state=42)
    over sorted patient ids; folds capped at the patient count
  grouping: patient
  n_folds: 5

runtime_defaults:
  backend: edf                              # raw EDF + TSV, so a fresh
                                            # checkout works after `fetch`
                                            # alone. `hdf5` is the fast path
                                            # once prepare has built a cache.
  balance: weighted_sampler
  batch_size: 64
  cache_root: ""
  data_root: "${EEG_DATA_ROOT}/sz2"
  fold: 0
  label_mode: binary
  montage: unipolar
  n_folds: 5
  normalize: none
  num_workers: 4
  overlap_threshold: 0.0
  window_s: 10.0


# Allowed values for the enumerable --set keys, and where the code
# enforces them. Surfaced by `--dataset <slug> --help`.
runtime_options:
  backend:
    values:
      - edf
      - hdf5
    enforced_by: dataio.sz2

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: neuroatlas.extensions.datasets.adapters.sz2.SeizeIt2BenchmarkDataModule
  default_task: seizure_detection
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: eeg
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - signal_kind
    - fold
    - n_folds

provenance:
  last_verified: 2026-09-21
