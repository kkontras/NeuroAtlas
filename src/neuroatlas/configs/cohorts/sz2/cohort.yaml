# sz2 — dataset manifest
#
# Schema: datasets/_schema.yaml
# First generated from the hand-written DatasetSpec this cohort used to have,
# plus the constants its per-dataset entrypoint pinned; hand-maintained since.
# Edit this file, not the spec module, which only binds the manifest to a
# datamodule.

schema_version: 1

slug: sz2
name: Sz2
domain: epilepsy
paper_dataset: true

description: >
  SeizeIt2 — binary seizure detection from 19-channel unipolar EEG
  resampled to 256 Hz. Anonymous Hospital Adult cohort. Patient-level
  k-fold evaluation.

cohort:
  centre: "UZ Leuven, Belgium (SeizeIT2, 9 cohorts)"
  country: BE
  powerline_hz: 50

acquisition:
  kind: internal

signal:
  montage: unipolar
  window_s: 10.0
  overlap_threshold: 0.0
  notch_freq: null

labels:
  granularity: window
  # one label per window; event-level metrics (any-overlap, FA/h) are computed on top of the window scores
  default: binary
  modes:
    binary: {}

splits:
  derivation: >
    StratifiedKFold(shuffle=True, random_state=42) over sorted patient ids;
    folds capped at the patient count
  derived_by: src/neuroatlas/extensions/datasets/adapters/sz2.py:93
  # No fold manifest: there is no file to inspect, but the split is
  # reproducible because the splitter is seeded and the subject order
  # is sorted.
  manifest: null
  grouping: patient
  n_folds: 5

runtime_defaults:
  backend: edf                              # raw EDF + TSV, so a fresh
                                            # checkout works after `fetch`
                                            # alone. `hdf5` is the fast path
                                            # once prepare has built a cache.
  balance: weighted_sampler
  batch_size: 64
  cache_root: ""
  data_root: "${EEG_DATA_ROOT}/SeizeIT2/Anonymous_Hospital_Adult/"
  fold: 0
  label_mode: binary
  montage: unipolar
  n_folds: 5
  normalize: none
  num_workers: 4
  overlap_threshold: 0.0
  window_s: 10.0


# Allowed values for the enumerable --set keys, and where the code
# enforces them. Surfaced by `--dataset <slug> --help`.
runtime_options:
  backend:
    values:
      - edf
      - hdf5
    enforced_by: dataio.sz2

spec:
  # The datamodule this cohort constructs. A dotted path, resolved on
  # first use, so the registry can build the spec without a per-cohort
  # Python module holding two strings.
  datamodule: neuroatlas.extensions.datasets.adapters.sz2.SeizeIt2BenchmarkDataModule
  default_task: seizure_detection
  supports_folds: true
  input_kind_signal_map:
    raw_timeseries: eeg
  metadata_keys:
    - canonical_label_space
    - epoch_seconds
    - channel_policy
    - signal_kind
    - fold
    - n_folds

provenance:
  last_verified: 2026-09-21
